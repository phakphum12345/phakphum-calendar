version: 2
updates:
  - package-ecosystem: composer
    directory: "/backend"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      laravel-runtime:
        patterns:
          - "laravel/*"
          - "symfony/*"
          - "guzzlehttp/*"
          - "league/*"
      php-tooling:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
