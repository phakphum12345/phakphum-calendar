name: Dart Format Batch

on:
  push:
    branches:
      - "chore/dart-format-batch-*"
    paths:
      - "lib/**/*.dart"
      - "test/**/*.dart"
      - "integration_test/**/*.dart"
      - ".github/format-batches/**"
      - ".github/workflows/dart-format-batch.yml"

permissions:
  contents: write

concurrency:
  group: dart-format-batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format-validate-commit:
    name: Format allowlisted Dart files and validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Load and validate explicit file allowlist
        id: allowlist
        shell: bash
        run: |
          set -euo pipefail
          batch="${GITHUB_REF_NAME##*-}"
          manifest=".github/format-batches/${batch}.txt"
          test -f "$manifest"
          mapfile -t files < <(sed '/^[[:space:]]*$/d' "$manifest")
          test "${#files[@]}" -gt 0
          for path in "${files[@]}"; do
            case "$path" in
              lib/l10n/app_localizations.dart|lib/l10n/app_localizations_en.dart|lib/l10n/app_localizations_th.dart)
                echo "Generated localization file is forbidden in formatter allowlist: $path"
                exit 1
                ;;
            esac
            git ls-files --error-unmatch "$path" >/dev/null
            case "$path" in
              lib/*.dart|lib/**/*.dart|test/*.dart|test/**/*.dart|integration_test/*.dart|integration_test/**/*.dart) ;;
              *) echo "Path outside permitted Dart roots: $path"; exit 1 ;;
            esac
          done
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/format-files.txt"
          echo "batch=$batch" >> "$GITHUB_OUTPUT"
          echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
          printf 'Allowlisted files (%s):\n' "${#files[@]}"
          printf ' - %s\n' "${files[@]}"

      - name: Resolve dependencies without changing the lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock

      - name: Format only allowlisted files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < "$RUNNER_TEMP/format-files.txt"
          dart format "${files[@]}"
          dart format --output=none --set-exit-if-changed "${files[@]}"
          git add -- "${files[@]}"

      - name: Regenerate and validate DISKPATH
        shell: bash
        run: |
          set -euo pipefail
          python tools/diskpath/generate_diskpath.py
          git add -- DISKPATH.json DISKPATH.md
          python tools/diskpath/validate_diskpath.py
          git diff --check
          git diff --cached --check

      - name: Static analysis
        run: flutter analyze

      - name: Full test suite
        run: flutter test

      - name: Verify exact staged file scope and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- pubspec.lock
          git diff --exit-code
          mapfile -t files < "$RUNNER_TEMP/format-files.txt"
          {
            printf '%s\n' "${files[@]}"
            printf '%s\n' DISKPATH.json DISKPATH.md
          } | sort -u > "$RUNNER_TEMP/expected.txt"
          git diff --cached --name-only | sort -u > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git diff --cached --check
          echo "Only allowlisted Dart files and regenerated DISKPATH manifests are staged."

      - name: Commit validated formatting batch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(format): format Dart batch ${{ steps.allowlist.outputs.batch }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Formatted batch commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Files formatted: ${{ steps.allowlist.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
