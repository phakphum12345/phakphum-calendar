name: Build iOS

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "lib/**"
      - "assets/**"
      - "ios/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "ios/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

# iOS owns its own runner lifecycle. Keep one current Xcode run per PR/ref so
# obsolete commits do not accumulate in the macOS runner queue.
concurrency:
  group: ios-xcode-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Let a running Xcode build finish; GitHub replaces only the older pending run.
  cancel-in-progress: false

jobs:
  build-ios:
    name: iOS / Xcode / Unsigned Release
    runs-on: ${{ vars.IOS_RUNNER_LABEL || 'macos-15' }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify macOS and Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "Checked-out commit: $(git rev-parse HEAD)"
          echo "Runner architecture: $(uname -m)"
          sw_vers
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify generated iOS Xcode project
        run: xcodebuild -list -project ios/Runner.xcodeproj

      - name: Configure optional Google iOS OAuth
        shell: bash
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$GOOGLE_IOS_CLIENT_ID" ]]; then
            /usr/libexec/PlistBuddy \
              -c "Set :GIDClientID $GOOGLE_IOS_CLIENT_ID" \
              ios/Runner/Info.plist
            reversed_client_id="com.googleusercontent.apps.${GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
            /usr/libexec/PlistBuddy \
              -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $reversed_client_id" \
              ios/Runner/Info.plist
          fi
          if [[ -n "$GOOGLE_SERVER_CLIENT_ID" ]]; then
            /usr/libexec/PlistBuddy \
              -c "Set :GIDServerClientID $GOOGLE_SERVER_CLIENT_ID" \
              ios/Runner/Info.plist
          fi

      - name: Require shared backend for production artifact
        if: github.ref == 'refs/heads/main'
        env:
          ORGANIZATION_API_BASE_URL: ${{ vars.ORGANIZATION_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ORGANIZATION_API_BASE_URL//[[:space:]]/}" || "$ORGANIZATION_API_BASE_URL" != https://* ]]; then
            echo "Production artifacts require an HTTPS ORGANIZATION_API_BASE_URL."
            exit 1
          fi

      - name: Build unsigned iOS application
        shell: bash
        env:
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          ORGANIZATION_API_BASE_URL: ${{ vars.ORGANIZATION_API_BASE_URL }}
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=ORGANIZATION_API_BASE_URL="$ORGANIZATION_API_BASE_URL"

      - name: Verify iOS application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist"

      - name: Package unsigned iOS artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ios/Payload
          cp -R build/ios/iphoneos/Runner.app dist/ios/Payload/Runner.app
          ditto -c -k --sequesterRsrc --keepParent \
            dist/ios/Payload \
            dist/ios/phakphum-calendar-unsigned.ipa
          shasum -a 256 dist/ios/phakphum-calendar-unsigned.ipa \
            > dist/ios/phakphum-calendar-unsigned.ipa.sha256
          test -s dist/ios/phakphum-calendar-unsigned.ipa
          test -s dist/ios/phakphum-calendar-unsigned.ipa.sha256

      - name: Upload unsigned iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: phakphum-calendar-ios-unsigned
          path: |
            dist/ios/phakphum-calendar-unsigned.ipa
            dist/ios/phakphum-calendar-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
