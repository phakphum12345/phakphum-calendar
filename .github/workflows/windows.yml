name: Build Windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "windows/**"
      - "web/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "DISKPATH.json"
      - "DISKPATH.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "windows/**"
      - "web/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "DISKPATH.json"
      - "DISKPATH.md"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 / Analyze / Test / Build
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Static analysis
        run: flutter analyze

      - name: Flutter tests
        run: flutter test

      - name: Require shared backend for production artifact
        id: backend_gate
        if: github.event_name != 'pull_request'
        env:
          ORGANIZATION_API_BASE_URL: ${{ vars.ORGANIZATION_API_BASE_URL }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ORGANIZATION_API_BASE_URL) -or
              -not $env:ORGANIZATION_API_BASE_URL.StartsWith('https://')) {
            Write-Host '::notice::Skipping Windows production artifact because ORGANIZATION_API_BASE_URL is not configured as HTTPS.'
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'available=false'
            @"
            ## Production artifact skipped
            No valid HTTPS ORGANIZATION_API_BASE_URL is configured. Build and upload steps were skipped; this is not a production release.
            "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value 'available=true'
          }

      - name: Build Windows release
        if: github.event_name == 'pull_request' || steps.backend_gate.outputs.available == 'true'
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          ORGANIZATION_API_BASE_URL: ${{ vars.ORGANIZATION_API_BASE_URL }}
        run: >-
          flutter build windows --release
          --dart-define=GOOGLE_SERVER_CLIENT_ID="$env:GOOGLE_SERVER_CLIENT_ID"
          --dart-define=ORGANIZATION_API_BASE_URL="$env:ORGANIZATION_API_BASE_URL"

      - name: Verify Windows executable
        if: github.event_name == 'pull_request' || steps.backend_gate.outputs.available == 'true'
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/phakphum_calendar.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Windows executable was not produced: $exe"
            exit 1
          }
          $item = Get-Item $exe
          Write-Host "Windows executable: $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"

      - name: Package Windows application
        if: github.event_name == 'pull_request' || steps.backend_gate.outputs.available == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/windows -Force | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/windows/phakphum-calendar-windows.zip -Force
          $hash = (Get-FileHash dist/windows/phakphum-calendar-windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  phakphum-calendar-windows.zip" | Set-Content dist/windows/SHA256SUMS.txt -Encoding ascii

      - name: Publish Windows gate summary
        env:
          BACKEND_AVAILABLE: ${{ steps.backend_gate.outputs.available }}
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -or $env:BACKEND_AVAILABLE -eq 'true') {
            @"
            ## Windows Final Gate
            - Flutter analyze: PASS
            - Flutter tests: PASS
            - Windows release build: PASS
            - Windows executable: PASS
            - Windows package: PASS
            "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            @"
            ## Windows Final Gate
            - Flutter analyze: PASS
            - Flutter tests: PASS
            - Production release artifact: SKIPPED — no HTTPS ORGANIZATION_API_BASE_URL configured
            "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload Windows artifact
        if: github.event_name == 'pull_request' || steps.backend_gate.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: phakphum-calendar-windows-x64
          path: dist/windows
          if-no-files-found: error
          retention-days: 14
