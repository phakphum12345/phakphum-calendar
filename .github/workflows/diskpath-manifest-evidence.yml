name: DISKPATH Manifest Validation

on:
  pull_request:
    paths:
      - "DISKPATH.json"
      - "DISKPATH.md"
      - "tools/diskpath/**"
      - ".github/workflows/diskpath-manifest-evidence.yml"
  push:
    branches: [main]
    paths:
      - "DISKPATH.json"
      - "DISKPATH.md"
      - "tools/diskpath/**"
      - ".github/workflows/diskpath-manifest-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diskpath-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate committed manifest against exact checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate committed manifests without rewriting
        run: |
          python3 tools/diskpath/generate_diskpath.py --check
          python3 tools/diskpath/validate_diskpath.py
          git diff --check

      - name: Upload validated manifests
        uses: actions/upload-artifact@v4
        with:
          name: diskpath-validated-manifests
          path: |
            DISKPATH.json
            DISKPATH.md
          if-no-files-found: error
          retention-days: 7

      - name: Record exact-SHA evidence
        run: |
          echo "## DISKPATH validation: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manifest file count: $(python3 -c 'import json; print(json.load(open(\"DISKPATH.json\", encoding=\"utf-8\"))[\"file_count\"])')" >> "$GITHUB_STEP_SUMMARY"
