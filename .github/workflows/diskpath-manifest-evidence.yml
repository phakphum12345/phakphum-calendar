name: DISKPATH Manifest Regeneration Evidence

on:
  pull_request:
    paths:
      - "DISKPATH.json"
      - "DISKPATH.md"
      - "tools/diskpath/**"
      - ".github/workflows/diskpath-manifest-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diskpath-manifest-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-and-validate:
    name: Regenerate manifest and validate exact checkout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Regenerate canonical manifests
        run: python3 tools/diskpath/generate_diskpath.py

      - name: Validate regenerated manifests
        run: |
          python3 tools/diskpath/generate_diskpath.py --check
          python3 tools/diskpath/validate_diskpath.py
          git diff --check

      - name: Upload regenerated manifests as review evidence
        uses: actions/upload-artifact@v4
        with:
          name: diskpath-regenerated-manifests
          path: |
            DISKPATH.json
            DISKPATH.md
          if-no-files-found: error
          retention-days: 7

      - name: Write exact-SHA summary
        run: |
          echo "## DISKPATH regeneration" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generator: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validator: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Manifest write-back: intentionally not performed by CI" >> "$GITHUB_STEP_SUMMARY"
