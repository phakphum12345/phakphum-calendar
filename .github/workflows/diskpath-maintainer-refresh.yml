name: DISKPATH Manifest Regeneration Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diskpath-regeneration-preview
  cancel-in-progress: true

jobs:
  regenerate:
    name: Generate and validate manifest preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate preview without committing
        run: |
          python3 tools/diskpath/generate_diskpath.py
          python3 tools/diskpath/generate_diskpath.py --check
          python3 tools/diskpath/validate_diskpath.py
          git diff --check

      - name: Upload generated preview
        uses: actions/upload-artifact@v4
        with:
          name: diskpath-regeneration-preview
          path: |
            DISKPATH.json
            DISKPATH.md
          if-no-files-found: error
          retention-days: 7
