name: Build Linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "windows/**"
      - "web/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "DISKPATH.json"
      - "DISKPATH.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "windows/**"
      - "web/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "DISKPATH.json"
      - "DISKPATH.md"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux x64 release build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Require shared backend for production artifact
        id: backend_gate
        if: github.event_name != 'pull_request'
        env:
          ORGANIZATION_API_BASE_URL: ${{ vars.ORGANIZATION_API_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ORGANIZATION_API_BASE_URL//[[:space:]]/}" || "$ORGANIZATION_API_BASE_URL" != https://* ]]; then
            echo "::notice::Skipping Linux production artifact because ORGANIZATION_API_BASE_URL is not configured as HTTPS."
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Production artifact skipped"
              echo "No valid HTTPS ORGANIZATION_API_BASE_URL is configured. Build and upload steps were skipped; this is not a production release."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux release
        if: github.event_name == 'pull_request' || steps.backend_gate.outputs.available == 'true'
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          ORGANIZATION_API_BASE_URL: ${{ vars.ORGANIZATION_API_BASE_URL }}
        run: >-
          flutter build linux --release
          --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          --dart-define=ORGANIZATION_API_BASE_URL="$ORGANIZATION_API_BASE_URL"

      - name: Package Linux application
        if: github.event_name == 'pull_request' || steps.backend_gate.outputs.available == 'true'
        run: |
          set -euo pipefail
          test -x build/linux/x64/release/bundle/phakphum_calendar
          mkdir -p dist/linux
          tar -czf dist/linux/phakphum-calendar-linux-x64.tar.gz \
            -C build/linux/x64/release bundle

      - name: Upload Linux application
        if: github.event_name == 'pull_request' || steps.backend_gate.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: phakphum-calendar-linux-x64
          path: dist/linux/phakphum-calendar-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14
