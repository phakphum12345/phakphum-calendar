name: One-time Symfony security dependency refresh

on:
  push:
    branches:
      - fix/shift-pay-rule-conflicts-2026-11-27

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(deps): refresh Symfony security fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Refresh only affected Symfony dependency family
        working-directory: backend
        run: |
          composer update symfony/http-kernel symfony/mailer symfony/routing --with-all-dependencies --no-install --no-scripts --no-interaction
          composer validate --strict
      - name: Commit lockfile only
        run: |
          if git diff --quiet -- backend/composer.lock; then
            echo "No lockfile change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/composer.lock
          git commit -m "chore(deps): refresh Symfony security fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
