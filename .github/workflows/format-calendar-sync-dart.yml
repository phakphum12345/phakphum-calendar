name: Format Calendar Sync Dart

on:
  push:
    branches:
      - fix/calendar-sync-etag-concurrency-2026-11-26
    paths:
      - "lib/features/calendar_engine/application/calendar_sync_plan.dart"
      - "lib/features/calendar_engine/application/calendar_sync_plan_builder.dart"
      - "lib/features/calendar_engine/application/resilient_calendar_sync_executor.dart"
      - "lib/features/calendar_engine/application/resume_sync_service.dart"
      - "lib/features/history/domain/sync_history_entry.dart"
      - "lib/features/history/infrastructure/sync_history_json_codec.dart"
      - "lib/features/calendar_engine/application/resume_sync_service.dart"
      - "lib/features/history/domain/sync_history_entry.dart"
      - "lib/features/history/infrastructure/sync_history_json_codec.dart"
      - "lib/features/calendar_engine/domain/calendar_sync_coordination_gateway.dart"
      - "lib/features/calendar_engine/domain/calendar_sync_operation_result.dart"
      - "lib/features/calendar_engine/infrastructure/backend_calendar_sync_coordination_gateway.dart"
      - "lib/features/workflow/application/calendar_sync_coordinator.dart"
      - "lib/core/di/app_dependencies.dart"
      - "test/calendar_sync_coordination_executor_test.dart"
      - ".github/workflows/format-calendar-sync-dart.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/features/calendar_engine/application/calendar_sync_plan.dart"
      - "lib/features/calendar_engine/application/calendar_sync_plan_builder.dart"
      - "lib/features/calendar_engine/application/resilient_calendar_sync_executor.dart"
      - "lib/features/calendar_engine/domain/calendar_sync_coordination_gateway.dart"
      - "lib/features/calendar_engine/domain/calendar_sync_operation_result.dart"
      - "lib/features/calendar_engine/infrastructure/backend_calendar_sync_coordination_gateway.dart"
      - "lib/features/workflow/application/calendar_sync_coordinator.dart"
      - "lib/core/di/app_dependencies.dart"
      - "test/calendar_sync_coordination_executor_test.dart"
      - ".github/workflows/format-calendar-sync-dart.yml"

permissions:
  contents: write

jobs:
  format-and-verify:
    name: Format and verify coordinated Calendar executor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Format coordination files
        run: |
          dart format \
            lib/features/calendar_engine/application/calendar_sync_plan.dart \
            lib/features/calendar_engine/application/calendar_sync_plan_builder.dart \
            lib/features/calendar_engine/application/resilient_calendar_sync_executor.dart lib/features/calendar_engine/application/resume_sync_service.dart lib/features/history/domain/sync_history_entry.dart lib/features/history/infrastructure/sync_history_json_codec.dart \
            lib/features/calendar_engine/application/resume_sync_service.dart \
            lib/features/history/domain/sync_history_entry.dart \
            lib/features/history/infrastructure/sync_history_json_codec.dart \
            lib/features/calendar_engine/domain/calendar_sync_coordination_gateway.dart \
            lib/features/calendar_engine/domain/calendar_sync_operation_result.dart \
            lib/features/calendar_engine/infrastructure/backend_calendar_sync_coordination_gateway.dart \
            lib/features/workflow/application/calendar_sync_coordinator.dart \
            lib/core/di/app_dependencies.dart \
            test/calendar_sync_coordination_executor_test.dart

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Commit only formatted and verified files
        run: |
          if git diff --quiet -- lib/features/calendar_engine/application/calendar_sync_plan.dart lib/features/calendar_engine/application/calendar_sync_plan_builder.dart lib/features/calendar_engine/application/resilient_calendar_sync_executor.dart lib/features/calendar_engine/domain/calendar_sync_coordination_gateway.dart lib/features/calendar_engine/domain/calendar_sync_operation_result.dart lib/features/calendar_engine/infrastructure/backend_calendar_sync_coordination_gateway.dart lib/features/workflow/application/calendar_sync_coordinator.dart lib/core/di/app_dependencies.dart test/calendar_sync_coordination_executor_test.dart; then
            echo "Calendar coordination Dart files are already formatted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- lib/features/calendar_engine/application/calendar_sync_plan.dart lib/features/calendar_engine/application/calendar_sync_plan_builder.dart lib/features/calendar_engine/application/resilient_calendar_sync_executor.dart lib/features/calendar_engine/application/resume_sync_service.dart lib/features/history/domain/sync_history_entry.dart lib/features/history/infrastructure/sync_history_json_codec.dart lib/features/calendar_engine/domain/calendar_sync_coordination_gateway.dart lib/features/calendar_engine/domain/calendar_sync_operation_result.dart lib/features/calendar_engine/infrastructure/backend_calendar_sync_coordination_gateway.dart lib/features/workflow/application/calendar_sync_coordinator.dart lib/core/di/app_dependencies.dart test/calendar_sync_coordination_executor_test.dart
            git commit -m "style(sync): format coordinated Calendar executor"
            git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          fi
