name: Roster knowledge schema

on:
  pull_request:
    paths:
      - "schemas/roster-knowledge-entry.schema.json"
      - "test/fixtures/roster_knowledge/**"
      - ".github/workflows/roster-knowledge-schema.yml"
  push:
    branches: [main]
    paths:
      - "schemas/roster-knowledge-entry.schema.json"
      - "test/fixtures/roster_knowledge/**"
      - ".github/workflows/roster-knowledge-schema.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate roster knowledge fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check "jsonschema[format]>=4.23,<5"

      - name: Validate positive and negative fixtures
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker, ValidationError

          schema_path = Path("schemas/roster-knowledge-entry.schema.json")
          schema = json.loads(schema_path.read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())

          valid_path = Path("test/fixtures/roster_knowledge/valid_organization_scoped_entry.json")
          valid_entry = json.loads(valid_path.read_text(encoding="utf-8"))
          validator.validate(valid_entry)
          print(f"PASS: {valid_path}")

          invalid_path = Path("test/fixtures/roster_knowledge/invalid_extra_property_entry.json")
          invalid_entry = json.loads(invalid_path.read_text(encoding="utf-8"))
          try:
              validator.validate(invalid_entry)
          except ValidationError:
              print(f"PASS: rejected invalid fixture {invalid_path}")
          else:
              raise SystemExit(f"FAIL: schema unexpectedly accepted {invalid_path}")
          PY
