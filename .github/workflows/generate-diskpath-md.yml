name: Generate DISKPATH

on:
  workflow_dispatch:

  pull_request:
  
  push:
    branches:
      - main
    paths-ignore:
      - "DISKPATH.json"
      - "DISKPATH.md"

concurrency:
  group: generate-diskpath-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    name: Generate and validate DISKPATH
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate DISKPATH
        run: |
          set -euo pipefail
          python3 tools/diskpath/generate_diskpath.py

      - name: Validate DISKPATH
        run: |
          set -euo pipefail
          python3 tools/diskpath/validate_diskpath.py

      - name: Check generated files
        run: |
          set -euo pipefail
          git diff --check

      - name: Enforce DISKPATH synchronization on pull requests
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          if git diff --quiet -- DISKPATH.json DISKPATH.md; then
            echo "DISKPATH ENFORCEMENT: PASS"
            echo "Generated manifests are synchronized with the repository."
            exit 0
          fi

          echo "DISKPATH ENFORCEMENT: FAIL"
          echo
          echo "DISKPATH.json and/or DISKPATH.md are out of date."
          echo "Run:"
          echo
          echo "  python3 tools/diskpath/generate_diskpath.py"
          echo
          echo "Then commit the generated files."
          echo
          git diff -- DISKPATH.json DISKPATH.md
          exit 1

      - name: Commit generated manifests on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          if git diff --quiet -- DISKPATH.json DISKPATH.md; then
            echo "DISKPATH is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add DISKPATH.json DISKPATH.md

          git commit -m "docs: update DISKPATH"

          git push origin HEAD:main
