name: Generate DISKPATH.md

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "DISKPATH.md"

permissions:
  contents: write

concurrency:
  group: generate-diskpath-md
  cancel-in-progress: true

jobs:
  generate:
    name: Generate repository disk path manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate DISKPATH.md
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from datetime import datetime, timezone

          root = Path(".").resolve()
          excluded = {".git", ".dart_tool", "build", ".idea"}
          files = []

          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              rel = path.relative_to(root)

              if any(part in excluded for part in rel.parts):
                  continue

              data = path.read_bytes()

              files.append(
                  (
                      rel.as_posix(),
                      len(data),
                      sha256(data).hexdigest(),
                  )
              )

          files.sort(key=lambda item: item[0])

          now = datetime.now(timezone.utc).replace(
              microsecond=0
          ).isoformat()

          lines = [
              "# DISKPATH",
              "",
              "> Automatically generated repository disk-path manifest.",
              "> Do not edit this file manually.",
              "",
              f"- Generated (UTC): `{now}`",
              f"- File count: **{len(files)}**",
              "",
              "## Repository Paths",
              "",
              "| Path | Bytes | SHA-256 |",
              "|---|---:|---|",
          ]

          lines.extend(
              f"| `{path}` | {size} | `{digest}` |"
              for path, size, digest in files
          )

          lines.append("")

          Path("DISKPATH.md").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )
          PY

      - name: Commit generated manifest
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- DISKPATH.md; then
            echo "DISKPATH.md is already current."
            exit 0
          fi

          git add DISKPATH.md
          git commit -m "docs: auto-generate DISKPATH.md"
          git push origin HEAD:main
