name: Build macOS (Xcode)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "lib/**"
      - "assets/**"
      - "macos/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/macos.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "macos/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

# This workflow owns its runner lifecycle. It does not depend on, wait for,
# Windows, Linux, Android, Web, or iOS workflows. Keep only the current Xcode
# run per PR/ref so obsolete commits do not accumulate in the macOS queue.
concurrency:
  group: macos-xcode-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS / Xcode / Unsigned Release
    runs-on: ${{ vars.MACOS_RUNNER_LABEL || 'macos-15' }}
    timeout-minutes: 60

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify macOS and Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "Checked-out commit: $(git rev-parse HEAD)"
          echo "Runner architecture: $(uname -m)"
          sw_vers
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Verify generated macOS Xcode project
        run: xcodebuild -list -project macos/Runner.xcodeproj

      - name: Build macOS application with the project ad-hoc signing identity
        run: flutter build macos --release

      - name: Verify macOS application bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/macos/Build/Products/Release/phakphum_calendar.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist"

      - name: Package ad-hoc macOS application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/macos
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/phakphum_calendar.app \
            dist/macos/phakphum-calendar-macos-adhoc.zip
          shasum -a 256 dist/macos/phakphum-calendar-macos-adhoc.zip \
            > dist/macos/phakphum-calendar-macos-adhoc.zip.sha256
          test -s dist/macos/phakphum-calendar-macos-adhoc.zip
          test -s dist/macos/phakphum-calendar-macos-adhoc.zip.sha256

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: phakphum-calendar-macos-adhoc
          path: |
            dist/macos/phakphum-calendar-macos-adhoc.zip
            dist/macos/phakphum-calendar-macos-adhoc.zip.sha256
          if-no-files-found: error
          retention-days: 14
