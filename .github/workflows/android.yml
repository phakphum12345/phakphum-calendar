
name: Build Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "windows/**"
      - "web/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "DISKPATH.json"
      - "DISKPATH.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "windows/**"
      - "web/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "DISKPATH.json"
      - "DISKPATH.md"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android APK release build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install Android NDK with retry
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK_ROOT}" ]; then
            echo "ERROR: Android SDK path is not configured."
            exit 1
          fi

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          NDK_DIR="${SDK_ROOT}/ndk/28.2.13676358"

          if [ ! -x "${SDKMANAGER}" ]; then
            echo "ERROR: sdkmanager not found: ${SDKMANAGER}"
            exit 1
          fi

          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true

          for attempt in 1 2 3; do
            echo "NDK installation attempt ${attempt}/3"

            if [ -f "${NDK_DIR}/source.properties" ]; then
              echo "NDK is already installed."
              exit 0
            fi

            rm -rf "${NDK_DIR}"
            rm -rf "${SDK_ROOT}/.temp"

            if "${SDKMANAGER}" --install "ndk;28.2.13676358" \
              && test -f "${NDK_DIR}/source.properties"; then
              cat "${NDK_DIR}/source.properties"
              echo "NDK installation verified."
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              sleep 15
            fi
          done

          echo "ERROR: NDK installation failed after 3 attempts."
          exit 1

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: >-
          flutter build apk --release
          --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Verify Android APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: phakphum-calendar-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
