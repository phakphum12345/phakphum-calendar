name: Build Android

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "windows/**"
      - "web/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "DISKPATH.json"
      - "DISKPATH.md"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "windows/**"
      - "web/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "DISKPATH.json"
      - "DISKPATH.md"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android APK release build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android release APK
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: >-
          flutter build apk --release
          --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Verify Android APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: phakphum-calendar-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
