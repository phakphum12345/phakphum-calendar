name: Final Gate

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "windows/**"
      - "web/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "DISKPATH.json"
      - "DISKPATH.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: final-gate-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  final-gate:
    name: Single collector / Quality + five platforms
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Collect all required evidence for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          SHA="$EVENT_SHA"
          export SHA
          echo "Final Gate collector SHA: $SHA"

          get_run_state() {
            local workflow="$1"

            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&head_sha=${SHA}&per_page=100" \
              --jq '
                [.workflow_runs[]
                 | select(.head_sha == env.SHA)
                 | select(.head_branch == "main")
                 | select(.event == "push")]
                | sort_by(.run_number, .run_attempt)
                | last // {}
                | [
                    (.status // "missing"),
                    (.conclusion // ""),
                    (.html_url // "")
                  ]
                | @tsv
              ' 2>/dev/null
          }

          workflows=(
            "Auto Detect CI:ci-auto-detect.yml"
            "Windows:windows.yml"
            "Web:web.yml"
            "Android:android.yml"
            "iOS:ios.yml"
            "Linux:linux.yml"
          )

          for attempt in $(seq 1 80); do
            pending=0
            failed=0

            echo ""
            echo "===== EVIDENCE CHECK ${attempt}/80 ====="

            for entry in "${workflows[@]}"; do
              label="${entry%%:*}"
              workflow="${entry#*:}"

              state="$(get_run_state "$workflow" || true)"

              if [[ -z "$state" ]]; then
                status="missing"
                conclusion=""
                url=""
              else
                IFS=$'\t' read -r status conclusion url <<< "$state"
                status="${status:-missing}"
                conclusion="${conclusion:-}"
                url="${url:-}"
              fi

              echo "$label: status=$status conclusion=${conclusion:-PENDING}"
              [[ -z "$url" ]] || echo "  $url"

              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "FAILURE OBSERVED: $label concluded ${conclusion:-unknown} for $SHA."
                  failed=1
                fi
              else
                pending=1
              fi
            done

            if [[ "$pending" -eq 0 && "$failed" -eq 0 ]]; then
              echo ""
              echo "FINAL PASS: all six workflows succeeded for $SHA."
              exit 0
            fi

            if [[ "$pending" -eq 0 && "$failed" -eq 1 ]]; then
              echo ""
              echo "FINAL FAIL: one or more latest workflow runs failed for $SHA."
              exit 1
            fi

            if [[ "$attempt" -lt 80 ]]; then
              sleep 30
            fi
          done

          echo "FINAL FAIL: evidence incomplete after 40 minutes for $SHA."
          exit 1

      - name: Verify supported delivery structure
        shell: bash
        run: |
          set -euo pipefail
          test -d windows
          test -d web
          test -d android
          test -d ios
          test -d linux
          test -f pubspec.yaml
          test -f .github/workflows/ci-auto-detect.yml
          test -f .github/workflows/windows.yml
          test -f .github/workflows/web.yml
          test -f .github/workflows/android.yml
          test -f .github/workflows/ios.yml
          test -f .github/workflows/linux.yml
          test -f .github/workflows/final-gate.yml
          test ! -f .github/workflows/flutter-ci.yaml
          test ! -f .github/workflows/flutter-web-deploy.yaml
          test ! -f .github/workflows/macos.yml
          echo 'MAIN VERIFIED: Windows + Web + Android + iOS + Linux active; macOS paused.'
