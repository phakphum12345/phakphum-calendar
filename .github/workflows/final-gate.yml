name: Final Gate

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "ios/**"
      - "linux/**"
      - "windows/**"
      - "web/**"
      - "test/**"
      - "integration_test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "DISKPATH.json"
      - "DISKPATH.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: final-gate-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  final-gate:
    name: Required quality + core delivery / optional platform evidence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 42

    steps:
      - name: Checkout exact target commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Collect required and optional evidence for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          SHA="$EVENT_SHA"
          export SHA
          echo "Final Gate collector SHA: $SHA"

          get_run_state() {
            local workflow="$1"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&head_sha=${SHA}&per_page=100" \
              --jq '
                [.workflow_runs[]
                 | select(.head_sha == env.SHA)
                 | select(.head_branch == "main")
                 | select(.event == "push")]
                | sort_by(.run_number, .run_attempt)
                | last // {}
                | [(.status // "missing"), (.conclusion // ""), (.html_url // "")]
                | @tsv
              ' 2>/dev/null
          }

          # These protect the user-facing application and its primary release paths.
          required_workflows=(
            "Auto Detect CI:ci-auto-detect.yml"
            "Windows:windows.yml"
            "Web:web.yml"
          )

          # These are best-effort artifacts. Their queue/build failures must not
          # block the core release; every skip is explicitly recorded below.
          optional_workflows=(
            "Android:android.yml"
            "iOS:ios.yml"
            "Linux:linux.yml"
          )

          optional_grace_attempt=20
          for attempt in $(seq 1 80); do
            required_pending=0
            required_failed=0
            optional_pending=0
            echo ""
            echo "===== EVIDENCE CHECK ${attempt}/80 ====="

            for entry in "${required_workflows[@]}"; do
              label="${entry%%:*}"
              workflow="${entry#*:}"
              state="$(get_run_state "$workflow" || true)"
              if [[ -z "$state" ]]; then
                status="missing"; conclusion=""; url=""
              else
                IFS=$'\t' read -r status conclusion url <<< "$state"
                status="${status:-missing}"; conclusion="${conclusion:-}"; url="${url:-}"
              fi

              echo "REQUIRED $label: status=$status conclusion=${conclusion:-PENDING}"
              [[ -z "$url" ]] || echo "  $url"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  echo "REQUIRED FAILURE: $label concluded ${conclusion:-unknown} for $SHA."
                  required_failed=1
                fi
              else
                required_pending=1
              fi
            done

            for entry in "${optional_workflows[@]}"; do
              label="${entry%%:*}"
              workflow="${entry#*:}"
              state="$(get_run_state "$workflow" || true)"
              if [[ -z "$state" ]]; then
                status="missing"; conclusion=""; url=""
              else
                IFS=$'\t' read -r status conclusion url <<< "$state"
                status="${status:-missing}"; conclusion="${conclusion:-}"; url="${url:-}"
              fi

              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                echo "OPTIONAL $label: PASS"
                [[ -z "$url" ]] || echo "  $url"
              elif [[ "$attempt" -lt "$optional_grace_attempt" && "$status" != "completed" ]]; then
                echo "OPTIONAL $label: WAITING (status=$status)"
                optional_pending=1
              else
                reason="${conclusion:-no successful run within grace period}"
                echo "OPTIONAL $label: SKIPPED (status=$status; reason=$reason)"
                [[ -z "$url" ]] || echo "  $url"
              fi
            done

            if [[ "$required_failed" -eq 1 ]]; then
              echo ""
              echo "FINAL FAIL: one or more required workflows failed for $SHA."
              exit 1
            fi

            if [[ "$required_pending" -eq 0 && "$optional_pending" -eq 0 ]]; then
              echo ""
              echo "Required evidence complete for $SHA."
              echo "Android/iOS/Linux are best-effort; see per-target PASS/SKIPPED lines above."
              exit 0
            fi

            if [[ "$attempt" -lt 80 ]]; then
              sleep 30
            fi
          done

          echo "FINAL FAIL: required evidence incomplete after 40 minutes for $SHA."
          exit 1

      - name: Verify required structure and report optional targets
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -d windows
          test -d web
          test -f .github/workflows/ci-auto-detect.yml
          test -f .github/workflows/windows.yml
          test -f .github/workflows/web.yml
          test -f .github/workflows/final-gate.yml
          test -f scripts/detect-ci-targets.sh

          echo "REQUIRED TARGETS: Windows + Web"
          for target in android ios linux; do
            if [[ -d "$target" && -f ".github/workflows/$target.yml" ]]; then
              echo "OPTIONAL TARGET $target: available; build evidence is best-effort"
            else
              echo "OPTIONAL TARGET $target: SKIPPED (platform source or workflow missing)"
            fi
          done
          echo "Capability-aware Final Gate structure check: PASS"
